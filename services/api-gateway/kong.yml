# Kong Gateway Configuration for XERPIUM Services
_format_version: "3.0"
_transform: true

services:
  # User Authentication Service
  - name: user-auth-service
    url: http://user-auth-service:8000
    tags:
      - xerpium
      - auth
    routes:
      - name: user-auth-routes
        paths:
          - /api/v1/auth
          - /api/auth
          - /api/admin
          - /api/services
          - /api/token
          - /api/audit
          - /api/password
          - /api/users
          - /health
        strip_path: false
        preserve_host: false

  # Company Partner Service  
  - name: company-partner-service
    url: http://company-partner-service:8000
    tags:
      - xerpium
      - business
    routes:
      - name: company-partner-routes
        paths:
          - /api/v1/base
        strip_path: true
        preserve_host: false 
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
      - name: company-partner-health
        paths:
          - /base-health
        strip_path: true
        preserve_host: false

  # Menu Access Service
  - name: menu-access-service
    url: http://menu-access-service:8003
    tags:
      - xerpium
      - access-control
    routes:
      - name: menu-access-routes
        paths:
          - /api/v1/menus
        strip_path: true
        preserve_host: false
      - name: menu-access-ui-schemas
        paths:
          - /api/v1/ui-schemas/menus
        strip_path: true 
        preserve_host: false
        methods: ["GET", "OPTIONS"]
      - name: menu-access-prefix-routes
        paths:
          - /menu-access
        strip_path: true
        preserve_host: false
      - name: menu-access-health
        paths:
          - /menu-health
        strip_path: true
        preserve_host: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:3001"
            - "http://localhost:8080"
            - "http://demo.xerpium.com:9000"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-Auth-Token
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

  # Service Registry
  - name: service-registry
    url: http://service-registry:8000
    tags:
      - xerpium
      - service-discovery
    routes:
      - name: service-registry-routes
        paths:
          - /api/v1/services
        strip_path: false
        preserve_host: false
        methods: ["GET", "POST", "PUT", "DELETE"]
      - name: service-registry-health
        paths:
          - /registry-health
        strip_path: true
        preserve_host: false

  # Inventory Service
  - name: inventory-service
    url: http://inventory-service:8005
    tags:
      - xerpium
      - inventory
    routes:
      - name: inventory-routes
        paths:
          - /api/v1/inventory
        strip_path: true
        preserve_host: false 
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

      - name: inventory-health
        paths:
          - /inventory-health
        strip_path: true
        preserve_host: false


  # UI Registry Service
  - name: ui-registry-service
    url: http://ui-registry-service:8010/api/v1
    tags:
      - xerpium
      - ui-registry
    routes:
      - name: ui-registry-base
        paths:
          - /api/v1/ui-registry
        strip_path: true
        preserve_host: false
        methods: ["GET"]
      - name: ui-registry-service-dashboard
        paths:
          - /api/v1/ui-registry
        strip_path: true
        preserve_host: false
        methods: ["GET"]
      - name: ui-registry-dashboard-widgets
        paths:
          - /api/v1/ui-registry
        strip_path: true
        preserve_host: false
        methods: ["GET"]
      - name: ui-registry-health
        paths:
          - /ui-registry-health
        strip_path: true
        preserve_host: false

  # Notification Service
  - name: notification-service
    url: http://notification-service:8005
    tags:
      - xerpium
      - notifications
    routes:
      - name: notification-stream-routes
        paths:
          - /api/v1/notifications/stream
        strip_path: true
        preserve_host: false
        methods: ["GET"]
      - name: notification-base-routes
        paths:
          - /api/v1/notifications
        strip_path: true
        preserve_host: false
        methods: ["GET"]
      - name: notification-test-routes
        paths:
          - /api/v1/notifications/test
        strip_path: true
        preserve_host: false
        methods: ["POST"]
      - name: notification-health
        paths:
          - /notification-health
        strip_path: true
        preserve_host: false

  # Purchasing Service
  - name: purchasing-service
    url: http://purchasing-service:8007
    tags:
      - xerpium
      - purchasing
    routes:
      - name: purchasing-routes-all
        paths:
          - /api/v1/purchasing
        strip_path: true 
        preserve_host: true
        request_buffering: false
        response_buffering: false
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
      - name: purchasing-dashboard
        paths:
          - /api/v1/purchasing
        strip_path: true 
        preserve_host: false
        service: purchasing-service
        methods: ["GET", "OPTIONS"]
      - name: purchasing-ui-schemas
        paths:
          - /api/v1/ui-schemas/purchasing
        strip_path: true 
        preserve_host: false
        service: purchasing-service
        methods: ["GET", "OPTIONS"]
      - name: purchasing-health
        paths:
          - /purchasing-health
        strip_path: true
        preserve_host: false

  # Sales Service
  - name: sales-service
    url: http://sales-service:8006
    tags:
      - xerpium
      - sales
    routes:
      - name: sales-routes
        paths:
          - /api/v1/sales
        strip_path: true
        preserve_host: false        
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
      - name: sales-health
        paths:
          - /sales-health
        strip_path: true
        preserve_host: false

plugins:
  # CORS Plugin for browser compatibility
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://localhost:8080"
        - "http://demo.xerpium.com:9000"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
        - "Host:demo.xerpium.com"  # Or use Kong's host
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # Request Size Limiting
  - name: request-size-limiting
    config:
      allowed_payload_size: 10

  # Rate Limiting (per consumer)
  - name: rate-limiting
    config:
      second: 100
      minute: 1000
      hour: 10000
      policy: local

  # Prometheus metrics
  - name: prometheus
    config:
      per_consumer: true

consumers:
  # Default consumer for development
  - username: m-erp-development
    custom_id: dev-001
    tags:
      - development

  # Service-to-service consumer
  - username: m-erp-services
    custom_id: services-001 
    tags:
      - services

