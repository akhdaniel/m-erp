services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: m-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: m_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default
  # Redis for messaging and caching
  redis:
    image: redis:7-alpine
    container_name: m-erp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default
  # User Authentication Service
  user-auth-service:
    build:
      context: .
      dockerfile: ./services/user-auth-service/Dockerfile
    container_name: m-erp-user-auth
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/user_auth_db
      SECRET_KEY: development-secret-key-change-in-production
      ENVIRONMENT: development
      DEBUG: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: user-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/user-auth-service:/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Company Partner Service
  company-partner-service:
    build:
      context: .
      dockerfile: ./services/company-partner-service/Dockerfile
    container_name: m-erp-company-partner
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/company_partner_db
      AUTH_SERVICE_URL: http://user-auth-service:8000
      SERVICE_KEY: company-partner-service-key-1234567890123456
      ENVIRONMENT: development
      DEBUG: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: company-partner-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-auth-service:
        condition: service_started
    volumes:
      - ./services/company-partner-service:/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Menu Access Service
  menu-access-service:
    build: ./services/menu-access-service
    container_name: m-erp-menu-access
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/menu_access_db
      AUTH_SERVICE_URL: http://user-auth-service:8000
      SERVICE_KEY: menu-access-service-key
      SERVICE_SECRET: menu-access-service-secret-key-that-is-long-enough
      SECRET_KEY: development-secret-key-change-in-production
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-auth-service:
        condition: service_started
    volumes:
      - ./services/menu-access-service:/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Service Registry
  service-registry:
    build: ./services/service-registry
    container_name: m-erp-service-registry
    ports:
      - "8004:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KONG_ADMIN_URL: http://kong:8001
      AUTH_SERVICE_URL: http://user-auth-service:8000
      DEBUG: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/service-registry:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # API Gateway (Kong)
  kong:
    image: kong:3.4
    container_name: m-erp-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"  # Proxy port (main API gateway)
      - "9001:8001"  # Admin API port
    volumes:
      - ./services/api-gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      - user-auth-service
      - company-partner-service
      - menu-access-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # UI Service (Vue.js Frontend)
  ui-service:
    build: 
      context: ./services/ui-service
      dockerfile: Dockerfile.dev
    container_name: m-erp-ui
    ports:
      - "9000:9000"  # Vite dev server
    environment:
      NODE_ENV: development
      VITE_INVENTORY_API: /api/v1
      VITE_SALES_API: /api/v1
      VITE_PURCHASING_API: /api/v1
      VITE_PARTNERS_API: /api/v1
      VITE_USERS_API: /api/v1
      VITE_COMPANY_PARTNER_API: /api/v1
      VITE_MENU_ACCESS_API: /api/v1
      VITE_MENU_API: /api/v1
      VITE_UI_REGISTRY_API: /api/v1
    volumes:
      - ./services/ui-service:/app
      - /app/node_modules  # Prevent overwriting node_modules
    depends_on:
      - kong
      - user-auth-service
      - menu-access-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default


  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: m-erp-notifications
    ports:
      - "8009:8005"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: notification-service
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Audit Service
  audit-service:
    build:
      context: .
      dockerfile: ./services/audit-service/Dockerfile
    container_name: m-erp-audit
    ports:
      - "8008:8006"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/audit_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: audit-service
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/audit-service:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: ./services/inventory-service/Dockerfile
    container_name: m-erp-inventory
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/inventory_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: inventory-service
      SERVICE_KEY: inventory-service-key
      SERVICE_SECRET: inventory-service-secret-key-that-is-long-enough
      AUTH_SERVICE_URL: http://user-auth-service:8000
      ENVIRONMENT: development
      DEBUG: "true"
      MENU_SERVICE_URL: http://menu-access-service:8003
      NOTIFICATION_URL: http://notification-service:8009
      UI_REGISTRY_URL: http://ui-registry-service:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/inventory-service:/app
      - ./services/shared:/app/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  # Sales Service
  sales-service:
    build:
      context: .
      dockerfile: ./services/sales-service/Dockerfile
    container_name: m-erp-sales
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sales_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: sales-service
      ENVIRONMENT: development
      DEBUG: "true"
      # Service integration URLs
      INVENTORY_SERVICE_URL: http://inventory-service:8005
      PARTNER_SERVICE_URL: http://company-partner-service:8000
      CURRENCY_SERVICE_URL: http://company-partner-service:8000
      AUDIT_SERVICE_URL: http://audit-service:8006
      MENU_SERVICE_URL: http://menu-access-service:8003
      UI_REGISTRY_URL: http://ui-registry-service:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_started
      company-partner-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/sales-service:/app
      - ./services/shared:/app/shared
    networks:
      - chat_default

  # UI Registry Service
  ui-registry-service:
    build: ./services/ui-registry-service
    container_name: m-erp-ui-registry
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: ui-registry-service
      DEBUG: "true"
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/ui-registry-service:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

  purchasing-service:
    build:
      context: .
      dockerfile: ./services/purchasing-service/Dockerfile
    container_name: m-erp-purchasing
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/purchasing_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_NAME: purchasing-service
      ENVIRONMENT: development
      DEBUG: "true"
      # Service integration URLs
      PARTNER_SERVICE_URL: http://company-partner-service:8000
      CURRENCY_SERVICE_URL: http://company-partner-service:8000
      AUDIT_SERVICE_URL: http://audit-service:8006
      MENU_SERVICE_URL: http://menu-access-service:8003
      UI_REGISTRY_URL: http://ui-registry-service:8010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/purchasing-service:/app
      - ./services/shared:/app/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chat_default

volumes:
  postgres_data:
  redis_data:

networks:
  chat_default:
    external: true
